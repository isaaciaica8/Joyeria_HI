      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('joyeria_hi_theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F7] text-[#18181B] dark:bg-[#0F0F12] dark:text-[#F5F3EE] antialiased selection:bg-[#9A7B3E]/20 selection:text-[#18181B] dark:selection:text-[#FAF9F7] transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
